{% extends 'base.html' %}

{% block title %}Registrar Ingreso - Music Pro{% endblock %}
{% block header_title %}Entrada de Mercadería (Recepción Bodega){% endblock %}

{% block content %}
<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form action="{% url 'historial' %}" method="GET" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Producto</label>
            <select class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
                <option value="">-- Buscar por código o nombre --</option>
                <option value="1">GTR-001 - Fender Stratocaster (Stock actual: 12)</option>
                <option value="2">AMP-045 - Amplificador Marshall 50W (Stock actual: 2)</option>
                <option value="3">BAT-010 - Batería Acústica Pearl (Stock actual: 5)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad a Ingresar</label>
                <input type="number" min="1" placeholder="Ej: 10" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Guía / Factura Proveedor</label>
                <input type="text" placeholder="F-89234" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones de Recepción</label>
            <textarea rows="3" placeholder="Estado del embalaje, verificación de sellos, etc." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm"></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition">Confirmar Ingreso</button>
        </div>
    </form>
</div>
{% endblock %}
