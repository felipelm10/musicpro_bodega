{% extends 'base.html' %}

{% block title %}Editar Producto - Music Pro{% endblock %}
{% block header_title %}Modificar Información de Producto{% endblock %}

{% block content %}
<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form action="{% url 'dashboard' %}" method="GET" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Código (No editable)</label>
                <input type="text" value="GTR-001" disabled class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-sm text-gray-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                <select class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                    <option selected>Cuerdas (Guitarras, Bajos)</option>
                    <option>Audio Profesional y Mezcla</option>
                    <option>Percusión y Baterías</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Instrumento</label>
            <input type="text" value="Guitarra Eléctrica Fender Stratocaster" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Mínimo (Alerta)</label>
                <input type="number" value="4" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación Actual</label>
                <input type="text" value="Pasillo A - Estante 2" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300 transition">Volver</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition">Actualizar Datos</button>
        </div>
    </form>
</div>
{% endblock %}
