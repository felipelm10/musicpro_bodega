{% extends 'base.html' %}

{% block title %}Nuevo Producto - Music Pro{% endblock %}
{% block header_title %}Registrar Nuevo Instrumento / Equipo{% endblock %}

{% block content %}
<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form action="{% url 'producto_crear' %}" method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Código de Producto</label>
                <input type="text" name="codigo" placeholder="Ej: GTR-102" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                <select name="categoria" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                    <option value="Cuerdas">Cuerdas (Guitarras, Bajos)</option>
                    <option value="Audio Profesional">Audio Profesional y Mezcla</option>
                    <option value="Percusión">Percusión y Baterías</option>
                    <option value="Teclados">Teclados y Sintetizadores</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Instrumento / Modelo</label>
            <input type="text" name="nombre" placeholder="Ej: Guitarra Gibson Les Paul Standard" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Inicial</label>
                <input type="number" name="stock" min="0" value="0" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Mínimo</label>
                <input type="number" name="stock_minimo" min="1" value="3" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación</label>
                <input type="text" name="ubicacion" placeholder="Ej: Pasillo B-4" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition">Guardar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
