{% extends 'base.html' %}

{% block title %}Registrar Salida - Music Pro{% endblock %}
{% block header_title %}Salida de Mercadería (Despacho a Sucursales){% endblock %}

{% block content %}
<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">

    {% if error %}
    <div class="mb-5 bg-red-100 border border-red-300 text-red-700 text-xs p-3 rounded-lg flex items-center space-x-2">
        <i class="fas fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="{% url 'salida' %}" method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Producto</label>
            <select name="producto_id" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
                <option value="">-- Seleccionar artículo con existencias --</option>
                {% for prod in productos %}
                <option value="{{ prod.id }}">
                    {{ prod.codigo }} - {{ prod.nombre }} (Disponible: {{ prod.stock }} unid.)
                </option>
                {% empty %}
                <option value="" disabled>No hay productos con stock disponible en bodega</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad a Despachar</label>
                <input type="number" name="cantidad" min="1" placeholder="Ej: 3" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Destino de la Carga</label>
                <select name="destino" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
                    <option value="Sucursal del Rock (Providencia)">Sucursal del Rock (Providencia)</option>
                    <option value="Sucursal del DJ (Las Condes)">Sucursal del DJ (Las Condes)</option>
                    <option value="Sucursal Reggaetón y Cumbia (Santiago Centro)">Sucursal Reggaetón y Cumbia (Santiago Centro)</option>
                    <option value="Escenario Principal - Tour 2026">Escenario Principal - Tour 2026</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Orden de Traslado</label>
                <input type="text" name="orden" placeholder="OT-5521" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Conductor / Asignado (Opcional)</label>
                <input type="text" placeholder="Ej: Camión 02" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
            </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition">Emitir Despacho</button>
        </div>
    </form>
</div>
{% endblock %}
