<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Music Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <header class="bg-gray-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-bold text-blue-500 tracking-wider">MUSIC PRO</span>
                <span class="text-xs bg-blue-900 text-blue-200 px-2 py-0.5 rounded font-semibold">Catálogo Clientes</span>
            </div>
            
            <div class="flex items-center space-x-6">
                <span class="text-sm text-gray-300">Bienvenido, <strong class="text-white">{{ cliente }}</strong></span>
                <a href="{% url 'logout' %}" class="text-xs text-red-400 hover:text-red-300 transition">
                    <i class="fas fa-sign-out-alt mr-1"></i>Cerrar Sesión
                </a>
            </div>
        </div>
    </header>

    <section class="bg-blue-600 text-white py-12 text-center">
        <h1 class="text-3xl font-bold mb-2">Catálogo de Instrumentos</h1>
        <p class="text-blue-100 text-sm">Selecciona tus productos y gestiona tus pedidos en línea.</p>
    </section>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {% for prod in productos %}
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col justify-between hover:shadow-md transition">
                <div class="text-center py-6 bg-gray-50 rounded-lg mb-4 text-4xl text-blue-600">
                    <i class="{{ prod.icono }}"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold text-blue-600 uppercase">{{ prod.categoria }}</span>
                    <h3 class="font-semibold text-gray-800 text-base mt-1">{{ prod.nombre }}</h3>
                    <p class="text-lg font-bold text-gray-900 mt-2">{{ prod.precio }}</p>
                </div>
                <button class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-lg transition flex items-center justify-center space-x-2">
                    <i class="fas fa-cart-shopping"></i>
                    <span>Solicitar Producto</span>
                </button>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
