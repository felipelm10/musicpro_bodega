<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Music Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-600/20 text-blue-500 mb-3">
                <i class="fas fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wider">CREAR CUENTA</h1>
            <p class="text-gray-400 text-xs mt-1">Regístrate como Cliente en Music Pro</p>
        </div>

        <form action="{% url 'registro' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-gray-300 mb-1">Nombre Completo</label>
                <input type="text" placeholder="Ej: Juan Pérez" class="w-full p-2.5 bg-gray-700/60 text-white rounded-lg text-sm border border-gray-600" required>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Correo Electrónico</label>
                <input type="email" placeholder="juan@correo.cl" class="w-full p-2.5 bg-gray-700/60 text-white rounded-lg text-sm border border-gray-600" required>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Contraseña</label>
                <input type="password" placeholder="••••••••" class="w-full p-2.5 bg-gray-700/60 text-white rounded-lg text-sm border border-gray-600" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                Completar Registro
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-400 border-t border-gray-700 pt-4">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-blue-400 hover:underline">Inicia Sesión</a>
        </div>
    </div>

</body>
</html>
