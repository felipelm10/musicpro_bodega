<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Music Pro Bodega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}">🎵 Music Pro</a>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'proveedores_listar' %}">📦 Proveedores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'sucursales_listar' %}">🏢 Sucursales</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'productos_listar' %}">🎸 Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="{% url 'reportes' %}">📊 Reportes y ORM</a>
                </li>
                <!-- El botón estrella del proyecto -->
                <li class="nav-item">
                    <a class="nav-link text-info fw-bold ms-3" href="{% url 'despachar' %}">🚚 Despachar a Sucursal</a>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center">
            <span class="navbar-text me-3 text-white">Hola, <strong>{{ request.user.username }}</strong></span>
            <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12 text-center">
            <h1>Panel Central de Bodega</h1>
            <p class="lead">Sistema de control logístico y distribución comercial.</p>
        </div>
    </div>
</div>
</body>
</html>
