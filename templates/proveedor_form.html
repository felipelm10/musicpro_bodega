<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">{% if proveedor %}Editar{% else %}Registrar Nuevo{% endif %} Proveedor</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">RUT</label>
                            <input type="text" name="rut" class="form-control" value="{{ proveedor.rut|default:'' }}" required placeholder="Ej: 76.543.210-K">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Razón Social</label>
                            <input type="text" name="razon_social" class="form-control" value="{{ proveedor.razon_social|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" value="{{ proveedor.email|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono|default:'' }}" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'proveedores_listar' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                {% if proveedor %}Actualizar{% else %}Guardar{% endif %} Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
