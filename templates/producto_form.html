<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if producto %}Editar{% else %}Nuevo{% endif %} Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">{% if producto %}Editar{% else %}Ingresar Nuevo{% endif %} Producto</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">SKU (Código Único)</label>
                                <input type="text" name="sku" class="form-control" value="{{ producto.sku|default:'' }}" required placeholder="Ej: PROD-001">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nombre del Producto</label>
                                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre|default:'' }}" required placeholder="Ej: Guitarra Fender Stratocaster">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Categoría</label>
                                <select name="categoria" class="form-select" required>
                                    <option value="">Selecciona una categoría...</option>
                                    {% for c in categorias %}
                                        <option value="{{ c.id }}" {% if producto.categoria.id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Proveedor</label>
                                <select name="proveedor" class="form-select" required>
                                    <option value="">Selecciona un proveedor...</option>
                                    {% for prov in proveedores %}
                                        <option value="{{ prov.id }}" {% if producto.proveedor.id == prov.id %}selected{% endif %}>{{ prov.razon_social }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Precio de Venta ($)</label>
                                <input type="number" name="precio" class="form-control" value="{{ producto.precio|default:'0' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Stock Actual (Cantidad en Bodega)</label>
                                <input type="number" name="stock_actual" class="form-control" value="{{ producto.stock_actual|default:'0' }}" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'productos_listar' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                {% if producto %}Actualizar{% else %}Guardar{% endif %} Producto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
