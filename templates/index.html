<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Pro - Bodega Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Navegación -->
    <header class="max-w-6xl mx-auto px-6 h-20 w-full flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <i class="fas fa-boxes-stacked text-blue-500 text-2xl"></i>
            <span class="text-2xl font-black tracking-widest text-white">MUSIC PRO</span>
        </div>
        <div>
            <a href="{% url 'login' %}" class="text-sm font-semibold bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-lg shadow-lg shadow-blue-600/30 transition">
                Acceder al Sistema
            </a>
        </div>
    </header>

    <!-- Hero -->
    <section class="max-w-4xl mx-auto px-6 py-20 text-center">
        <span class="bg-blue-900/60 border border-blue-500/40 text-blue-300 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">
            Bodega Central & Logística
        </span>
        <h1 class="text-5xl font-extrabold mt-6 leading-tight">
            Control y Administración de Inventario
        </h1>
        <p class="text-gray-400 mt-4 text-lg">
            Gestión en tiempo real de existencias, control de stock crítico y auditoría de movimientos.
        </p>
        <div class="mt-8">
            <a href="{% url 'login' %}" class="bg-blue-600 hover:bg-blue-700 px-8 py-3.5 rounded-lg font-semibold text-sm transition shadow-lg shadow-blue-600/30">
                Iniciar Sesión en el Panel
            </a>
        </div>
    </section>

    <footer class="text-center py-6 text-xs text-gray-500 border-t border-gray-800">
        Music Pro © 2026 - Logística e Inventario Interno
    </footer>

</body>
</html>
