{% extends 'base.html' %}

{% block title %}Nuevo Usuario - Music Pro{% endblock %}
{% block header_title %}Crear Cuenta de Personal{% endblock %}

{% block content %}
<div class="max-w-xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    {% if error %}
    <div class="mb-4 bg-red-100 border border-red-300 text-red-700 text-xs p-3 rounded-lg">
        {{ error }}
    </div>
    {% endif %}

    <form action="{% url 'usuario_crear' %}" method="POST" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Identificador / RUT</label>
                <input type="text" name="username" placeholder="Ej: 19882301-4 o cmorales" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rol Operativo</label>
                <select name="rol" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                    <option value="operario">Operario de Bodega</option>
                    <option value="jefe">Jefe de Bodega</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
            <input type="text" name="nombre" placeholder="Ej: Camila Morales" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Institucional</label>
            <input type="email" name="email" placeholder="cmorales@musicpro.cl" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña Inicial</label>
            <input type="password" name="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm" required>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="{% url 'usuarios_listar' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition">Crear Usuario</button>
        </div>
    </form>
</div>
{% endblock %}
